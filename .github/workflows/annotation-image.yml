name: Annotation Image Test

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  image-annotation:
    runs-on: ubuntu-latest
    steps:
      - name: Add markdown image job summary
        run: |
          emit_summary_line() {
            printf 'echo "%s" >> "$GITHUB_STEP_SUMMARY"\n' "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          emit_summary_line "## Security scan finding: unsanitized task report output"
          emit_summary_line "The generated daily report appears to render task titles and tags directly into Markdown/HTML without escaping user-controlled content. A malicious task title such as \`<img src=x onerror=alert(1)>\` could execute script in any web view or issue comment that displays the report."
          emit_summary_line "This looks like a stored XSS risk because task data can persist and be rendered later by another user. Escape report fields before rendering, or use a Markdown/HTML sanitizer that strips inline event handlers and unsafe URLs."
          emit_summary_line "![This is fine](https://upload.wikimedia.org/wikipedia/en/c/cb/This_is_fine_from_On_Fire_strip_by_KC_Green.jpg)"
